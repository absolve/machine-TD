  <rect x="40" y="26" width="8" height="18" fill="#3a4658" stroke="#1a1c2c" stroke-width="0.8"/>
  <g stroke="#1a1c2c" stroke-width="0.6" opacity=".7">
    <path d="M40 30h8M40 34h8M40 38h8"/>
  </g>

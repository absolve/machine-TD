  <g fill="#1a1c2c">
    <circle cx="14" cy="17" r="0.8"/>
    <circle cx="50" cy="17" r="0.8"/>
    <circle cx="14" cy="47" r="0.8"/>
    <circle cx="50" cy="47" r="0.8"/>
  </g>
  <!-- 高光斜面 -->
  <path d="M48 17l5 5v3l-5-5Z" fill="#dceaf2" opacity=".35"/>

  <rect x="10" y="22" width="2" height="2" fill="#94b0c2" opacity=".95"/>
  <rect x="10" y="25" width="2" height="2" fill="#94b0c2" opacity=".5"/>
  <rect x="52" y="22" width="2" height="2" fill="#a95035"/>
  <rect x="52" y="25" width="2" height="2" fill="#a95035" opacity=".5"/>

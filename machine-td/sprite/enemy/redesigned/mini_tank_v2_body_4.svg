  <circle cx="28" cy="32" r="6" fill="#0a0e1a"/>
  <circle cx="28" cy="32" r="5" fill="#3a4658" stroke="#1a1c2c" stroke-width="1"/>
  <circle cx="28" cy="32" r="3.5" fill="#566c86"/>
  <!-- 小单管炮 -->
  <rect x="20" y="31" width="8" height="2" fill="#1a1c2c"/>
  <rect x="20" y="31" width="6" height="1" fill="#94b0c2"/>
  <!-- 观察窗（开放驾驶） -->
  <rect x="40" y="20" width="6" height="3" fill="#1a1c2c"/>
  <rect x="41" y="21" width="4" height="1" fill="#94b0c2" opacity=".7"/>

  <path d="M8 8H56L57 12H7Z" fill="#dceaf2" opacity=".5"/>
  <!-- 底部阴影 -->
  <path d="M7 53L11 54H53L57 53V54H7Z" fill="#1a1c2c" opacity=".6"/>

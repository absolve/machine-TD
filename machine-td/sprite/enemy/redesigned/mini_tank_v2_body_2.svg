    <circle cx="14" cy="20.75" r="0.8"/>
    <circle cx="50" cy="20.75" r="0.8"/>
    <circle cx="14" cy="43.25" r="0.8"/>
    <circle cx="50" cy="43.25" r="0.8"/>
  </g>

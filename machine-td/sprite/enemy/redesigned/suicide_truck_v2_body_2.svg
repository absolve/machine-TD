<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <clipPath id="stTrackClip">
      <rect x="1" y="3" width="62" height="11" rx="5" ry="5"/>
      <rect x="1" y="50" width="62" height="11" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <!-- 自爆车 帧1：卡车头 + 大炸弹（带尾翼 + 橙环） + 危险条纹 -->
  <g clip-path="url(#stTrackClip)">
    <rect x="1" y="3" width="62" height="11" fill="#1a1c2c"/>
    <rect x="1" y="3" width="62" height="1.5" fill="#333c57"/>
    <rect x="1" y="12.5" width="62" height="1.5" fill="#333c57"/>
    <g fill="#3d4964">
      <rect x="-1" y="3" width="5" height="2"/>
      <rect x="5" y="3" width="5" height="2"/>
      <rect x="11" y="3" width="5" height="2"/>
      <rect x="17" y="3" width="5" height="2"/>
      <rect x="23" y="3" width="5" height="2"/>
      <rect x="29" y="3" width="5" height="2"/>
      <rect x="35" y="3" width="5" height="2"/>
      <rect x="41" y="3" width="5" height="2"/>
      <rect x="47" y="3" width="5" height="2"/>
      <rect x="53" y="3" width="5" height="2"/>
      <rect x="59" y="3" width="2" height="2"/>
      <rect x="2" y="6" width="5" height="2"/>
      <rect x="8" y="6" width="5" height="2"/>
      <rect x="14" y="6" width="5" height="2"/>
      <rect x="20" y="6" width="5" height="2"/>
      <rect x="26" y="6" width="5" height="2"/>
      <rect x="32" y="6" width="5" height="2"/>
      <rect x="38" y="6" width="5" height="2"/>
      <rect x="44" y="6" width="5" height="2"/>
      <rect x="50" y="6" width="5" height="2"/>
      <rect x="56" y="6" width="5" height="2"/>
    </g>
  </g>
  <g clip-path="url(#stTrackClip)">
    <rect x="1" y="50" width="62" height="11" fill="#1a1c2c"/>
    <rect x="1" y="50" width="62" height="1.5" fill="#333c57"/>
    <rect x="1" y="59.5" width="62" height="1.5" fill="#333c57"/>
    <g fill="#3d4964">
      <rect x="-1" y="56" width="5" height="2"/>
      <rect x="5" y="56" width="5" height="2"/>
      <rect x="11" y="56" width="5" height="2"/>
      <rect x="17" y="56" width="5" height="2"/>
      <rect x="23" y="56" width="5" height="2"/>
      <rect x="29" y="56" width="5" height="2"/>
      <rect x="35" y="56" width="5" height="2"/>
      <rect x="41" y="56" width="5" height="2"/>
      <rect x="47" y="56" width="5" height="2"/>
      <rect x="53" y="56" width="5" height="2"/>
      <rect x="59" y="56" width="2" height="2"/>
      <rect x="2" y="59" width="5" height="2"/>
      <rect x="8" y="59" width="5" height="2"/>
      <rect x="14" y="59" width="5" height="2"/>
      <rect x="20" y="59" width="5" height="2"/>
      <rect x="26" y="59" width="5" height="2"/>
      <rect x="32" y="59" width="5" height="2"/>
      <rect x="38" y="59" width="5" height="2"/>
      <rect x="44" y="59" width="5" height="2"/>
      <rect x="50" y="59" width="5" height="2"/>
      <rect x="56" y="59" width="5" height="2"/>
    </g>
  </g>
  <!-- 底盘外壳（与坦克一致：盖住履带内沿） -->
  <path d="M7 8H57L61 14V50L57 56H7L3 50V14Z" fill="#0a0e1a" opacity=".5"/>
  <path d="M8 8H56L60 14V50L56 56H8L4 50V14Z" fill="#566c86" stroke="#1a1c2c" stroke-width="2"/>
  <path d="M11 12H53L57 16V48L53 52H11L9 20V16Z" fill="#5f7794" stroke="#1a1c2c" stroke-width="1"/>
  <!-- 顶部受光 -->
  <path d="M8 8H56L57 12H7Z" fill="#dceaf2" opacity=".5"/>
  <!-- 底部阴影 -->
  <path d="M7 53L11 54H53L57 53V54H7Z" fill="#1a1c2c" opacity=".6"/>
  <!-- 驾驶室（左侧：x=4-18） -->
  <path d="M4 16H18L20 20V40L18 42H4L2 40V20Z" fill="#0a0e1a" opacity=".5"/>
  <path d="M4 16H18L20 20V40L18 42H4L2 40V20Z" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.5"/>
  <path d="M6 19H16L18 21V39L16 41H6L4 39V21Z" fill="#566c86"/>
  <!-- 危险条纹（黄黑：自爆车特征） -->
  <g fill="#ffc61a">
    <rect x="6" y="14" width="12" height="2"/>
    <rect x="6" y="42" width="12" height="2"/>
  </g>
  <g fill="#1a1c2c">
    <rect x="9" y="14" width="2" height="2"/>
    <rect x="13" y="14" width="2" height="2"/>
    <rect x="9" y="42" width="2" height="2"/>
    <rect x="13" y="42" width="2" height="2"/>
  </g>
  <!-- 风挡 -->
  <rect x="6" y="22" width="10" height="3" fill="#1a1c2c"/>
  <rect x="7" y="23" width="8" height="1" fill="#94b0c2" opacity=".7"/>
  <!-- 驾驶室与货厢间隙 -->
  <rect x="20" y="16" width="2" height="26" fill="#1a1c2c"/>
  <!-- 货厢（短：x=22-44） -->
  <rect x="22" y="14" width="22" height="30" fill="#3a4658" stroke="#1a1c2c" stroke-width="1"/>
  <rect x="22" y="14" width="22" height="2" fill="#566c86"/>
  <!-- 货厢顶警示条纹（3 段：黑黄黑） -->
  <g fill="#1a1c2c">
    <rect x="22" y="14" width="7" height="2"/>
    <rect x="36" y="14" width="7" height="2"/>
  </g>
  <g fill="#ffc61a">
    <rect x="29" y="14" width="7" height="2"/>
  </g>
  <!-- 货厢尾门 3 段危险条纹（垂直） -->
  <g fill="#1a1c2c">
    <rect x="42" y="16" width="2" height="28"/>
  </g>
  <g fill="#ffc61a">
    <rect x="40" y="16" width="2" height="28"/>
  </g>
  <!-- 大炸弹（在车体后半部分） -->
  <!-- 弹体（圆头 + 圆柱 + 尾翼） -->
  <ellipse cx="52" cy="29" rx="6" ry="4" fill="#0a0e1a" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="46" y="25" width="12" height="8" fill="#1a1c2c" stroke="#1a1c2c" stroke-width="1.2"/>
  <!-- 弹体高光 -->
  <rect x="47" y="26" width="10" height="2" fill="#566c86"/>
  <!-- 橙色危险环（弹体中段） -->
  <rect x="46" y="28" width="12" height="2" fill="#e08a2e"/>
  <rect x="46" y="29" width="12" height="0.5" fill="#ffc61a"/>
  <!-- 弹头（锥形） -->
  <path d="M58 25L62 29L58 33Z" fill="#3a4658" stroke="#1a1c2c" stroke-width="1"/>
  <path d="M58 26L61 29L58 32Z" fill="#94b0c2" opacity=".6"/>
  <!-- 尾翼（菱形） -->
  <path d="M44 22L46 29L44 36L40 29Z" fill="#1a1c2c"/>
  <path d="M44 24L45 29L44 34L42 29Z" fill="#566c86"/>
  <!-- 炸弹固定支架（V 形托架） -->
  <path d="M44 36L48 40L52 40L56 36" fill="none" stroke="#1a1c2c" stroke-width="1.2"/>
  <!-- 信号灯（全部为危险红） -->
  <rect x="4" y="26" width="2" height="2" fill="#a95035"/>
  <rect x="4" y="29" width="2" height="2" fill="#a95035" opacity=".5"/>
  <rect x="60" y="20" width="2" height="2" fill="#a95035"/>
  <rect x="60" y="23" width="2" height="2" fill="#a95035" opacity=".5"/>
  <!-- 铆钉 -->
  <g fill="#1a1c2c">
    <circle cx="6" cy="20" r="0.7"/>
    <circle cx="16" cy="20" r="0.7"/>
    <circle cx="6" cy="38" r="0.7"/>
    <circle cx="16" cy="38" r="0.7"/>
  </g>
  <!-- 高光斜面 -->
  <path d="M48 16l5 5v3l-5-5Z" fill="#94b0c2" opacity=".35"/>
</svg>

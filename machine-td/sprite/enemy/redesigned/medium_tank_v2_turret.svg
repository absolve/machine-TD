<svg xmlns="http://www.w3.org/2000/svg" width="46" height="20" viewBox="0 0 46 20" shape-rendering="crispEdges">
  <!-- 中型坦克 炮塔：标准蓝灰 + 圆炮塔座 + 单管中等炮 -->
  <circle cx="8.3" cy="10" r="7.3" fill="#0a0e1a"/>
  <circle cx="8.3" cy="10" r="6.4" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <circle cx="8.3" cy="10" r="5.1" fill="#566c86"/>
  <g stroke="#1a1c2c" stroke-width="0.7" opacity=".7">
    <path d="M 1.8 10 h 1.4 M 13.3 10 h 1.4 M 8.3 3.7 v 1.3 M 8.3 15 v 1.3"/>
  </g>
  <!-- 圆心炮口基座 -->
  <rect x="12.9" y="8.2" width="3.7" height="3.7" fill="#1a1c2c"/>
  <!-- 单管炮身（中等） -->
  <rect x="16.6" y="9.1" width="20.2" height="1.8" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="16.6" y="10.9" width="20.2" height="0.4" fill="#1a1c2c"/>
  <rect x="16.6" y="9.3" width="20.2" height="0.3" fill="#94b0c2" opacity=".6"/>
  <!-- 炮口套 -->
  <rect x="36.8" y="8.2" width="3.7" height="3.7" rx="0.5" fill="#1a1c2c" stroke="#1a1c2c" stroke-width="1"/>
  <rect x="37.7" y="9.1" width="1.8" height="1.8" fill="#0a0e1a"/>
  <!-- 顶部天线/传感器 -->
  <rect x="7.4" y="2.8" width="0.9" height="2.8" fill="#1a1c2c"/>
  <circle cx="7.8" cy="2.8" r="0.7" fill="#94b0c2"/>
  <!-- 顶部受光 -->
  <path d="M 8.3 3.7 L 10.1 4.6 H 6.4 Z" fill="#dceaf2" opacity=".5"/>
</svg>

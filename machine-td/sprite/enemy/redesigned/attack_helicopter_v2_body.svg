<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 64 48" shape-rendering="crispEdges">
  <!-- 武装直升机 俯视：机身 + 尾梁（左）+ 短翼 + 尾旋翼 + 主旋翼轴座 -->
  <!-- 阴影（地面投影） -->
  <ellipse cx="32" cy="44" rx="22" ry="2" fill="#1a1c2c" opacity=".2"/>
  <!-- 尾梁（左延：x=2-18，对齐 body 中线 y=26） -->
  <rect x="2" y="24.5" width="16" height="3" fill="#3a4658" stroke="#1a1c2c" stroke-width="0.8"/>
  <!-- 尾梁加强筋 -->
  <g stroke="#1a1c2c" stroke-width="0.4" opacity=".7">
    <path d="M5 24.5v3M8 24.5v3M11 24.5v3M14 24.5v3"/>
  </g>
  <!-- 尾旋翼（俯视：小圆） -->
  <circle cx="2" cy="26" r="3" fill="#1a1c2c"/>
  <circle cx="2" cy="26" r="1.2" fill="#3a4658"/>
  <!-- 尾旋翼叶片（横竖 2 短片，固定） -->
  <g stroke="#1a1c2c" stroke-width="0.4" opacity=".7">
    <path d="M-1 26h6M2 23v6"/>
  </g>
  <!-- 短翼（垂直于机身，上下各一） -->
  <g fill="#3a4658" stroke="#1a1c2c" stroke-width="0.8">
    <rect x="20" y="18.5" width="20" height="3"/>
    <rect x="20" y="31.25" width="20" height="3"/>
  </g>
  <!-- 短翼顶受光 -->
  <g fill="#94b0c2" opacity=".55">
    <rect x="20" y="18.5" width="20" height="0.6"/>
    <rect x="20" y="31.25" width="20" height="0.6"/>
  </g>
  <!-- 导弹挂架 -->
  <g fill="#1a1c2c">
    <rect x="22" y="21.5" width="3" height="2"/>
    <rect x="22" y="29" width="3" height="2"/>
    <rect x="36" y="21.5" width="3" height="2"/>
    <rect x="36" y="29" width="3" height="2"/>
  </g>
  <!-- 导弹（4 枚：上下翼各 2 枚，红色头朝右 = 前方） -->
  <g fill="#94b0c2" stroke="#1a1c2c" stroke-width="0.5">
    <rect x="22" y="20.75" width="6" height="1.4"/>
    <rect x="22" y="22.25" width="6" height="1.4"/>
    <rect x="22" y="29" width="6" height="1.4"/>
    <rect x="22" y="30.5" width="6" height="1.4"/>
  </g>
  <g fill="#a95035">
    <rect x="28" y="20.75" width="0.8" height="1.4"/>
    <rect x="28" y="22.25" width="0.8" height="1.4"/>
    <rect x="28" y="29" width="0.8" height="1.4"/>
    <rect x="28" y="30.5" width="0.8" height="1.4"/>
  </g>
  <!-- 主机身（驾驶舱 + 引擎舱，俯视：左窄右宽梯形） -->
  <path d="M18 24.5 L22 23 H46 L50 26 L46 29 H22 L18 27.5 Z" fill="#0a0e1a" opacity=".5"/>
  <path d="M19 24.5 L23 23.75 H45 L49 26 L45 28.25 H23 L19 27.5 Z" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <!-- 驾驶舱风挡（俯视：右端梯形，深色 + 亮蓝高光） -->
  <path d="M49 26 L45 24.5 H47 L51 26 L49 26 Z" fill="#1a1c2c"/>
  <path d="M48 26 L45 25 H46.5 L49.5 26 L48 26 Z" fill="#94b0c2" opacity=".7"/>
  <!-- 机身顶受光 -->
  <path d="M19 23.75 H45 L46 24.5 H20 Z" fill="#566c86"/>
  <!-- 机身底受光 -->
  <path d="M19 27.5 H45 V28.25 H19 Z" fill="#1a1c2c"/>
  <!-- 危险黄警示（机头/机尾） -->
  <rect x="46" y="23" width="1" height="1" fill="#ffc61a"/>
  <rect x="2" y="25" width="1" height="1" fill="#ffc61a"/>
  <!-- 信号灯（机身） -->
  <rect x="22" y="24.5" width="1.5" height="1" fill="#a95035"/>
  <rect x="38" y="24.5" width="1.5" height="1" fill="#7fd0c6"/>
  <!-- 铆钉 -->
  <g fill="#1a1c2c">
    <circle cx="22" cy="26" r="0.5"/>
    <circle cx="28" cy="26" r="0.5"/>
    <circle cx="34" cy="26" r="0.5"/>
    <circle cx="40" cy="26" r="0.5"/>
  </g>
  <!-- 主旋翼轴座（俯视：小圆，会被主旋翼覆盖） -->
  <circle cx="32" cy="26" r="2.5" fill="#0a0e1a"/>
  <circle cx="32" cy="26" r="1.5" fill="#1a1c2c"/>
  <circle cx="32" cy="26" r="0.6" fill="#3a4658"/>
</svg>

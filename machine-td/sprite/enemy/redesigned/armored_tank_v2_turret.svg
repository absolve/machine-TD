<svg xmlns="http://www.w3.org/2000/svg" width="46" height="20" viewBox="0 0 46 20" shape-rendering="crispEdges">
  <!-- 装甲坦克 炮塔：厚座 + 双管重炮 + 金色螺栓 -->
  <rect x="1.8" y="5.4" width="12.9" height="9.1" rx="0.9" fill="#0a0e1a" opacity=".5"/>
  <rect x="1.8" y="5.4" width="12.9" height="9.1" rx="0.9" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.4"/>
  <rect x="1.8" y="5.4" width="12.9" height="1.8" rx="0.5" fill="#566c86"/>
  <rect x="1.8" y="12.8" width="12.9" height="1.8" fill="#1a1c2c"/>
  <!-- 装甲刻线 -->
  <g stroke="#1a1c2c" stroke-width="0.8" opacity=".7">
    <path d="M 8.3 5.4 v 9.1 M 1.8 10 h 12.9"/>
  </g>
  <!-- 金色螺栓（精英） -->
  <circle cx="3.7" cy="7.2" r="0.7" fill="#ffc61a"/>
  <circle cx="12.9" cy="7.2" r="0.7" fill="#ffc61a"/>
  <circle cx="3.7" cy="12.8" r="0.7" fill="#ffc61a"/>
  <circle cx="12.9" cy="12.8" r="0.7" fill="#ffc61a"/>
  <!-- 反应装甲小贴片（顶部） -->
  <rect x="4.6" y="3.7" width="1.8" height="1.8" fill="#566c86" stroke="#1a1c2c" stroke-width="0.5"/>
  <rect x="10.1" y="3.7" width="1.8" height="1.8" fill="#566c86" stroke="#1a1c2c" stroke-width="0.5"/>
  <!-- 双管基座 -->
  <rect x="14.7" y="6.3" width="5.5" height="7.2" fill="#1a1c2c"/>
  <!-- 上炮管（粗） -->
  <rect x="20.2" y="7.2" width="18.4" height="2.8" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="20.2" y="10" width="18.4" height="0.4" fill="#1a1c2c"/>
  <rect x="20.2" y="8.2" width="18.4" height="0.4" fill="#94b0c2" opacity=".6"/>
  <!-- 下炮管 -->
  <rect x="20.2" y="10.9" width="18.4" height="2.8" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="20.2" y="13.7" width="18.4" height="0.4" fill="#1a1c2c"/>
  <rect x="20.2" y="11.8" width="18.4" height="0.4" fill="#94b0c2" opacity=".6"/>
  <!-- 炮口套（深色） -->
  <rect x="38.6" y="6.3" width="3.7" height="4.6" rx="0.5" fill="#0a0e1a" stroke="#1a1c2c" stroke-width="1"/>
  <rect x="38.6" y="10.9" width="3.7" height="4.6" rx="0.5" fill="#0a0e1a" stroke="#1a1c2c" stroke-width="1"/>
  <!-- 炮口闪光槽 -->
  <rect x="39.6" y="8.2" width="1.8" height="0.9" fill="#a95035"/>
  <rect x="39.6" y="12.8" width="1.8" height="0.9" fill="#a95035"/>
  <!-- 顶部天线/传感器 -->
  <rect x="5.5" y="2.8" width="0.9" height="2.8" fill="#1a1c2c"/>
  <circle cx="6" cy="2.8" r="0.7" fill="#ffc61a"/>
</svg>

  <rect x="6" y="21.5" width="10" height="4" fill="#1a1c2c"/>
  <rect x="7" y="22.25" width="8" height="2" fill="#94b0c2" opacity=".7"/>
  <!-- 引擎盖条纹 -->
  <g stroke="#1a1c2c" stroke-width="0.6" opacity=".7">
    <path d="M6 27.5 h10 M6 30.5 h10 M6 33.5 h10 M6 36.5 h10"/>
  </g>
  <!-- 驾驶室门把手 -->
  <rect x="14" y="29.75" width="1" height="2" fill="#1a1c2c"/>

  <path d="M8 14 H56 L60 18.5 V45.5 L56 50 H8 L4 45.5 V18.5 Z" fill="#566c86" stroke="#1a1c2c" stroke-width="2"/>
  <path d="M14 17 H50 L54 20 V44 L50 47 H14 L12 44 V20 Z" fill="#5f7794" stroke="#1a1c2c" stroke-width="1"/>

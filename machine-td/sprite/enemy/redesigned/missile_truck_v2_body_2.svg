  <rect x="20" y="18.5" width="2" height="28" fill="#1a1c2c"/>
  <!-- 货厢底板 -->
  <rect x="22" y="18.5" width="38" height="28" fill="#3a4658" stroke="#1a1c2c" stroke-width="1"/>
  <!-- 货厢顶受光 -->
  <rect x="22" y="18.5" width="38" height="2" fill="#566c86"/>
  <!-- 4 管导弹发射架（中央 4 根方管，朝 +X） -->
  <rect x="24" y="21.5" width="32" height="20" fill="#1a1c2c" stroke="#1a1c2c" stroke-width="0.8"/>
  <!-- 4 条管槽（每条 6 宽） -->
  <g fill="#3a4658" stroke="#1a1c2c" stroke-width="0.6">
    <rect x="26" y="23" width="6" height="16"/>
    <rect x="34" y="23" width="6" height="16"/>
    <rect x="42" y="23" width="6" height="16"/>
    <rect x="50" y="23" width="6" height="16"/>
  </g>
  <!-- 管芯（亮色高光：每条 2 宽居中） -->
  <g fill="#94b0c2">
    <rect x="28" y="23.75" width="2" height="14"/>
    <rect x="36" y="23.75" width="2" height="14"/>
    <rect x="44" y="23.75" width="2" height="14"/>
    <rect x="52" y="23.75" width="2" height="14"/>
  </g>
  <!-- 管口（前端深色套） -->
  <g fill="#0a0e1a">
    <rect x="32" y="23" width="2" height="16"/>
    <rect x="40" y="23" width="2" height="16"/>
    <rect x="48" y="23" width="2" height="16"/>
    <rect x="56" y="23" width="2" height="16"/>
  </g>
  <!-- 危险黄警示角 -->
  <rect x="22" y="18.5" width="3" height="2" fill="#ffc61a"/>
  <rect x="57" y="18.5" width="3" height="2" fill="#ffc61a"/>
  <!-- 提手槽（货厢前缘） -->
  <rect x="36" y="38" width="10" height="1" fill="#1a1c2c"/>
  <!-- 铆钉（货厢四角） -->
  <g fill="#1a1c2c">
    <circle cx="24" cy="20" r="0.8"/>
    <circle cx="58" cy="20" r="0.8"/>
    <circle cx="24" cy="38" r="0.8"/>
    <circle cx="58" cy="38" r="0.8"/>
  </g>
  <!-- 信号灯 -->
  <rect x="4" y="23" width="2" height="2" fill="#94b0c2" opacity=".95"/>
  <rect x="4" y="25.25" width="2" height="2" fill="#94b0c2" opacity=".5"/>
  <rect x="60" y="23" width="2" height="2" fill="#a95035"/>
  <rect x="60" y="25.25" width="2" height="2" fill="#a95035" opacity=".5"/>
  <!-- 高光斜面 -->
  <path d="M48 18.5 l5 5 v3 l-5 -5 Z" fill="#94b0c2" opacity=".35"/>

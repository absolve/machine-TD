  <path d="M8 14 H56 L57 17 H7 Z" fill="#dceaf2" opacity=".5"/>
  <!-- 底部阴影 -->
  <path d="M7 47.75 L11 48.5 H53 L57 47.75 V48.5 H7 Z" fill="#1a1c2c" opacity=".6"/>

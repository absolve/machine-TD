      <rect x="50" y="6" width="5" height="2"/>
      <rect x="56" y="6" width="5" height="2"/>
    </g>
  </g>
  <g clip-path="url(#mtTrackClip)">
    <rect x="1" y="46" width="62" height="16" fill="#1a1c2c"/>
    <rect x="1" y="46" width="62" height="2" fill="#333c57"/>
    <rect x="1" y="60" width="62" height="2" fill="#333c57"/>
    <g fill="#3d4964">

<svg xmlns="http://www.w3.org/2000/svg" width="46" height="20" viewBox="0 0 46 20" shape-rendering="crispEdges">
  <!-- 重型坦克 炮塔：箱式底座 + 单根特长炮管 + 锈红装饰 -->
  <rect x="1.8" y="4.6" width="12.9" height="10.9" rx="0.9" fill="#0a0e1a" opacity=".5"/>
  <rect x="1.8" y="4.6" width="12.9" height="10.9" rx="0.9" fill="#2a3344" stroke="#1a1c2c" stroke-width="1.4"/>
  <rect x="1.8" y="4.6" width="12.9" height="1.8" rx="0.5" fill="#3a4658"/>
  <rect x="1.8" y="13.7" width="12.9" height="1.8" fill="#1a1c2c"/>
  <!-- 箱式强化线条 -->
  <g stroke="#1a1c2c" stroke-width="0.7" opacity=".7">
    <path d="M 5.5 4.6 v 10.9 M 9.2 4.6 v 10.9 M 1.8 8.2 h 12.9 M 1.8 11.8 h 12.9"/>
  </g>
  <!-- 铆钉（深色密） -->
  <g fill="#1a1c2c">
    <circle cx="3.7" cy="6.3" r="0.7"/>
    <circle cx="12.9" cy="6.3" r="0.7"/>
    <circle cx="3.7" cy="13.7" r="0.7"/>
    <circle cx="12.9" cy="13.7" r="0.7"/>
  </g>
  <!-- 单管基座（粗） -->
  <rect x="14.7" y="7.2" width="4.6" height="5.4" fill="#1a1c2c"/>
  <rect x="14.7" y="8.2" width="4.6" height="0.9" fill="#3a4658"/>
  <!-- 单管炮身（特长，最粗） -->
  <rect x="19.3" y="8.2" width="20.2" height="3.7" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="19.3" y="11.8" width="20.2" height="0.4" fill="#1a1c2c"/>
  <rect x="19.3" y="8.7" width="20.2" height="0.4" fill="#566c86" opacity=".6"/>
  <!-- 炮口制退器（粗大） -->
  <rect x="39.6" y="7.2" width="4.6" height="5.4" fill="#1a1c2c" stroke="#1a1c2c" stroke-width="1"/>
  <rect x="40.5" y="9.1" width="2.8" height="1.8" fill="#0a0e1a"/>
  <rect x="40.5" y="11.8" width="2.8" height="0.9" fill="#1a1c2c"/>
  <!-- 锈红装饰条 -->
  <rect x="20.2" y="10" width="18.4" height="0.4" fill="#a95035"/>
  <!-- 顶部受光（少） -->
  <path d="M 1.8 4.6 H 14.7 L 12.9 6.3 H 3.7 Z" fill="#566c86" opacity=".5"/>
  <!-- 顶部天线/传感器 -->
  <rect x="5.5" y="2.8" width="0.9" height="1.8" fill="#1a1c2c"/>
  <circle cx="6" cy="2.8" r="0.6" fill="#a95035"/>
</svg>

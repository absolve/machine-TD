<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" viewBox="0 0 48 24" shape-rendering="crispEdges">
  <!-- 实验坦克 v3 炮塔：青色能量核心 + 黄色测试警示 + 外露原型装备 -->
  <!-- 炮塔基座（圆形旋转底座） -->
  <circle cx="18" cy="12" r="8" fill="#0a0e1a" stroke="#1a1c2c" stroke-width="1"/>
  <circle cx="18" cy="12" r="7" fill="#2a3247" stroke="#1a1c2c" stroke-width="1.4"/>
  <circle cx="18" cy="12" r="5" fill="#333c57"/>
  <!-- 旋转底座外环刻线 -->
  <g stroke="#1a1c2c" stroke-width="0.8" opacity=".7">
    <path d="M11 12h1.5M23.5 12h1.5M18 5v1.5M18 17.5v1.5"/>
  </g>
  <!-- 黄色测试警示环（外圈） -->
  <circle cx="18" cy="12" r="6.4" fill="none" stroke="#ffc61a" stroke-width="0.5" opacity=".9"/>
  <circle cx="18" cy="12" r="6.1" fill="none" stroke="#1a1c2c" stroke-width="0.3"/>
  <!-- 青色能量核心（原型特征：六边形代替圆） -->
  <path d="M18 9.2L20.7 10.8L20.7 13.2L18 14.8L15.3 13.2L15.3 10.8Z" fill="#1a4a52"/>
  <path d="M18 10L20 11L20 13L18 14L16 13L16 11Z" fill="#2a7a8a"/>
  <path d="M18 10.6L19.4 11.4L19.4 12.6L18 13.4L16.6 12.6L16.6 11.4Z" fill="#48b2a8" opacity=".95"/>
  <path d="M18 11.2L18.8 11.7L18.8 12.3L18 12.8L17.2 12.3L17.2 11.7Z" fill="#7fd0c6"/>
  <circle cx="18" cy="12" r="0.5" fill="#ffffff"/>
  <!-- 炮塔装甲盒 -->
  <rect x="6" y="7" width="10" height="10" rx="1.5" fill="#566c86" stroke="#1a1c2c" stroke-width="1.4"/>
  <!-- 装甲顶部高光 -->
  <path d="M6 7H16L14 9H8Z" fill="#dceaf2" opacity=".55"/>
  <!-- 装甲侧面阴影 -->
  <path d="M6 14H16L14 17H8Z" fill="#333c57" opacity=".7"/>
  <!-- 装甲顶边黄色测试条 -->
  <rect x="6" y="7" width="10" height="0.6" fill="#ffc61a"/>
  <rect x="6" y="7.6" width="10" height="0.3" fill="#1a1c2c" opacity=".5"/>
  <!-- 装甲底边黄色测试条 -->
  <rect x="6" y="16.4" width="10" height="0.6" fill="#ffc61a"/>
  <rect x="6" y="17" width="10" height="0.3" fill="#1a1c2c" opacity=".5"/>
  <!-- 青色能量灯（侧边双排） -->
  <rect x="7" y="10" width="2" height="2" fill="#48b2a8"/>
  <rect x="13" y="10" width="2" height="2" fill="#48b2a8" opacity=".7"/>
  <rect x="7" y="12.5" width="2" height="2" fill="#7fd0c6"/>
  <rect x="13" y="12.5" width="2" height="2" fill="#7fd0c6" opacity=".7"/>
  <!-- 散热鳍（原型的外露装备） -->
  <g fill="#1a1c2c">
    <rect x="6" y="9" width="0.6" height="0.8"/>
    <rect x="6" y="14" width="0.6" height="0.8"/>
    <rect x="15.4" y="9" width="0.6" height="0.8"/>
    <rect x="15.4" y="14" width="0.6" height="0.8"/>
  </g>
  <!-- 炮管基座 -->
  <path d="M22 9h16v6H22Z" fill="#333c57" stroke="#1a1c2c" stroke-width="1.5"/>
  <!-- 炮管顶部受光 -->
  <path d="M22 9h16v1.5H22Z" fill="#566c86" opacity=".7"/>
  <!-- 炮管侧面阴影 -->
  <path d="M22 13.5h16v1.5H22Z" fill="#1a1c2c" opacity=".8"/>
  <!-- 炮管顶边黄色测试条 -->
  <rect x="22" y="9" width="16" height="0.5" fill="#ffc61a"/>
  <!-- 炮管底边黄色测试条 -->
  <rect x="22" y="14.5" width="16" height="0.5" fill="#ffc61a"/>
  <!-- 炮管内青色能量条 -->
  <rect x="24" y="11" width="11" height="2" fill="#48b2a8" opacity=".9"/>
  <rect x="24" y="11" width="11" height="0.6" fill="#7fd0c6"/>
  <!-- 炮口圆环 -->
  <rect x="38" y="7" width="6" height="10" rx="1" fill="#1a1c2c" stroke="#0a0e1a" stroke-width="1.4"/>
  <rect x="39" y="9" width="4" height="6" rx="0.5" fill="#0a0e1a"/>
  <!-- 炮口青色能量环 -->
  <circle cx="41" cy="12" r="1.8" fill="#48b2a8" opacity=".85"/>
  <circle cx="41" cy="12" r="1" fill="#7fd0c6"/>
  <!-- 炮塔基座下的指示灯 -->
  <rect x="14" y="18" width="8" height="1.5" fill="#48b2a8" opacity=".6"/>
  <rect x="14" y="20" width="8" height="1" fill="#7fd0c6" opacity=".4"/>
  <!-- 顶部天线（原型特征） -->
  <rect x="11" y="4.5" width="0.6" height="2.5" fill="#1a1c2c"/>
  <circle cx="11.3" cy="4.5" r="0.6" fill="#48b2a8"/>
  <circle cx="11.3" cy="4.5" r="0.3" fill="#7fd0c6"/>
</svg>

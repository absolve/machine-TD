<svg xmlns="http://www.w3.org/2000/svg" width="46" height="20" viewBox="0 0 46 20" shape-rendering="crispEdges">
  <!-- 导弹车 炮塔：单管矩形火箭发射架（俯视，空载状态） -->
  <!-- 整体外壳 -->
  <rect x="1.8" y="2.8" width="42.3" height="14.6" fill="#0a0e1a" opacity=".5"/>
  <rect x="1.8" y="2.8" width="42.3" height="14.6" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.4"/>

  <!-- 左端装甲端板 -->
  <rect x="1.8" y="2.8" width="5.5" height="14.6" fill="#1a1c2c"/>
  <rect x="2.8" y="3.7" width="3.7" height="12.8" fill="#333c57"/>
  <rect x="2.8" y="3.7" width="3.7" height="0.4" fill="#94b0c2" opacity=".6"/>
  <circle cx="3.7" cy="5.4" r="0.5" fill="#1a1c2c"/>
  <circle cx="3.7" cy="14.6" r="0.5" fill="#1a1c2c"/>

  <!-- 端板与管的连接支架 -->
  <rect x="6.4" y="5.4" width="1.8" height="9.1" fill="#1a1c2c"/>
  <rect x="6.9" y="5.9" width="0.9" height="8.2" fill="#333c57"/>

  <!-- 中段：单管凹槽（空载深色） -->
  <rect x="8.3" y="5.4" width="25.8" height="9.1" fill="#0a0e1a"/>

  <!-- 管内顶部导轨 -->
  <rect x="8.3" y="5.4" width="25.8" height="0.7" fill="#1a1c2c"/>
  <rect x="8.3" y="6.1" width="25.8" height="0.2" fill="#566c86" opacity=".7"/>

  <!-- 管内底部导轨 -->
  <rect x="8.3" y="13.9" width="25.8" height="0.7" fill="#1a1c2c"/>
  <rect x="8.3" y="13.9" width="25.8" height="0.2" fill="#566c86" opacity=".7"/>

  <!-- 装填夹具（3 个垂直夹爪） -->
  <g fill="#1a1c2c">
    <rect x="12.9" y="5.4" width="0.6" height="9.1"/>
    <rect x="20.2" y="5.4" width="0.6" height="9.1"/>
    <rect x="27.6" y="5.4" width="0.6" height="9.1"/>
  </g>
  <!-- 夹具金属卡扣 -->
  <g fill="#566c86">
    <rect x="12.5" y="6.6" width="1.3" height="0.4"/>
    <rect x="12.5" y="13" width="1.3" height="0.4"/>
    <rect x="19.9" y="6.6" width="1.3" height="0.4"/>
    <rect x="19.9" y="13" width="1.3" height="0.4"/>
    <rect x="27.3" y="6.6" width="1.3" height="0.4"/>
    <rect x="27.3" y="13" width="1.3" height="0.4"/>
  </g>

  <!-- 管内通风格栅（左/右） -->
  <g fill="#1a1c2c">
    <rect x="8.7" y="6.8" width="2.8" height="0.2"/>
    <rect x="8.7" y="7.4" width="2.8" height="0.2"/>
    <rect x="8.7" y="8.1" width="2.8" height="0.2"/>
    <rect x="30.8" y="6.8" width="2.8" height="0.2"/>
    <rect x="30.8" y="7.4" width="2.8" height="0.2"/>
    <rect x="30.8" y="8.1" width="2.8" height="0.2"/>
  </g>

  <!-- 装填状态指示灯（黄） -->
  <circle cx="32.7" cy="9.1" r="0.7" fill="#1a1c2c"/>
  <circle cx="32.7" cy="9.1" r="0.3" fill="#ffc61a"/>

  <!-- 电缆/液压管（沿中线） -->
  <rect x="8.3" y="10" width="25.8" height="0.4" fill="#1a1c2c"/>
  <rect x="8.3" y="10" width="25.8" height="0.2" fill="#566c86" opacity=".6"/>
  <!-- 液压接头 -->
  <rect x="13.8" y="9.4" width="0.9" height="1.4" fill="#333c57"/>
  <rect x="24.8" y="9.4" width="0.9" height="1.4" fill="#333c57"/>
  <rect x="13.8" y="9.4" width="0.9" height="0.2" fill="#566c86"/>
  <rect x="24.8" y="9.4" width="0.9" height="0.2" fill="#566c86"/>

  <!-- 装填滚轮（管内底部） -->
  <g fill="#333c57">
    <rect x="15.6" y="11.8" width="1.4" height="1.1"/>
    <rect x="23" y="11.8" width="1.4" height="1.1"/>
    <rect x="30.4" y="11.8" width="1.4" height="1.1"/>
  </g>
  <g fill="#566c86">
    <rect x="15.6" y="11.8" width="1.4" height="0.2"/>
    <rect x="23" y="11.8" width="1.4" height="0.2"/>
    <rect x="30.4" y="11.8" width="1.4" height="0.2"/>
  </g>

  <!-- 中段右侧：状态面板（在管与炮口之间） -->
  <rect x="34" y="5.4" width="4.6" height="9.1" fill="#1a1c2c"/>
  <rect x="34.5" y="5.9" width="3.7" height="8.2" fill="#333c57"/>
  <!-- 状态灯（黄=就绪 / 暗=锁定） -->
  <rect x="35" y="6.3" width="0.7" height="0.8" fill="#ffc61a"/>
  <rect x="37.3" y="6.3" width="0.7" height="0.8" fill="#1a1c2c"/>
  <!-- 状态标签条 -->
  <rect x="35" y="8.2" width="3" height="0.2" fill="#566c86"/>
  <rect x="35" y="9.1" width="3" height="0.2" fill="#566c86"/>
  <rect x="35" y="11.8" width="3" height="0.2" fill="#566c86"/>
  <rect x="35" y="12.8" width="3" height="0.2" fill="#566c86"/>
  <!-- 面板四角螺丝 -->
  <circle cx="34.7" cy="6.2" r="0.2" fill="#1a1c2c"/>
  <circle cx="37.9" cy="6.2" r="0.2" fill="#1a1c2c"/>
  <circle cx="34.7" cy="13.8" r="0.2" fill="#1a1c2c"/>
  <circle cx="37.9" cy="13.8" r="0.2" fill="#1a1c2c"/>

  <!-- 发射架顶受光 + 底阴影 -->
  <path d="M 1.8 2.8 H 44.2 L 44.2 3.7 H 1.8 Z" fill="#94b0c2" opacity=".5"/>
  <path d="M 1.8 17.2 H 44.2 V 18.2 H 1.8 Z" fill="#1a1c2c" opacity=".7"/>

  <!-- 危险黄警示 -->
  <rect x="1.8" y="2.8" width="42.3" height="0.6" fill="#ffc61a"/>
  <rect x="1.8" y="16.8" width="42.3" height="0.6" fill="#ffc61a"/>

  <!-- 铆钉（4 角） -->
  <g fill="#1a1c2c">
    <circle cx="3.7" cy="3.7" r="0.5"/>
    <circle cx="42.3" cy="3.7" r="0.5"/>
    <circle cx="3.7" cy="16.3" r="0.5"/>
    <circle cx="42.3" cy="16.3" r="0.5"/>
  </g>

  <!-- 炮口（右端：方形） -->
  <rect x="38.6" y="2.8" width="5.5" height="14.6" fill="#1a1c2c" stroke="#0a0e1a" stroke-width="1"/>
  <rect x="39.6" y="4.6" width="3.7" height="10.9" fill="#0a0e1a"/>
  <!-- 炮口内膛（暗） -->
  <rect x="40.5" y="6.3" width="1.8" height="7.2" fill="#1a1c2c"/>
  <!-- 炮口顶/底黄色 -->
  <rect x="38.6" y="2.8" width="5.5" height="0.6" fill="#ffc61a"/>
  <rect x="38.6" y="16.8" width="5.5" height="0.6" fill="#ffc61a"/>
</svg>

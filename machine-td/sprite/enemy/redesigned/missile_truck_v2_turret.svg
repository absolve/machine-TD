<svg xmlns="http://www.w3.org/2000/svg" width="50" height="22" viewBox="0 0 50 22" shape-rendering="crispEdges">
  <!-- 导弹车 炮塔：单管矩形火箭发射架（俯视，空载状态） -->
  <!-- 整体外壳 -->
  <rect x="2" y="3" width="46" height="16" fill="#0a0e1a" opacity=".5"/>
  <rect x="2" y="3" width="46" height="16" fill="#3a4658" stroke="#1a1c2c" stroke-width="1.4"/>

  <!-- 左端装甲端板 -->
  <rect x="2" y="3" width="6" height="16" fill="#1a1c2c"/>
  <rect x="3" y="4" width="4" height="14" fill="#333c57"/>
  <rect x="3" y="4" width="4" height="0.5" fill="#94b0c2" opacity=".6"/>
  <circle cx="4" cy="6" r="0.5" fill="#1a1c2c"/>
  <circle cx="4" cy="16" r="0.5" fill="#1a1c2c"/>

  <!-- 端板与管的连接支架 -->
  <rect x="7" y="6" width="2" height="10" fill="#1a1c2c"/>
  <rect x="7.5" y="6.5" width="1" height="9" fill="#333c57"/>

  <!-- 中段：单管凹槽（空载深色） -->
  <rect x="9" y="6" width="28" height="10" fill="#0a0e1a"/>

  <!-- 管内顶部导轨 -->
  <rect x="9" y="6" width="28" height="0.7" fill="#1a1c2c"/>
  <rect x="9" y="6.7" width="28" height="0.3" fill="#566c86" opacity=".7"/>

  <!-- 管内底部导轨 -->
  <rect x="9" y="15.3" width="28" height="0.7" fill="#1a1c2c"/>
  <rect x="9" y="15.3" width="28" height="0.3" fill="#566c86" opacity=".7"/>

  <!-- 装填夹具（3 个垂直夹爪） -->
  <g fill="#1a1c2c">
    <rect x="14" y="6" width="0.6" height="10"/>
    <rect x="22" y="6" width="0.6" height="10"/>
    <rect x="30" y="6" width="0.6" height="10"/>
  </g>
  <!-- 夹具金属卡扣 -->
  <g fill="#566c86">
    <rect x="13.6" y="7.2" width="1.4" height="0.5"/>
    <rect x="13.6" y="14.3" width="1.4" height="0.5"/>
    <rect x="21.6" y="7.2" width="1.4" height="0.5"/>
    <rect x="21.6" y="14.3" width="1.4" height="0.5"/>
    <rect x="29.6" y="7.2" width="1.4" height="0.5"/>
    <rect x="29.6" y="14.3" width="1.4" height="0.5"/>
  </g>

  <!-- 管内通风格栅（左/右） -->
  <g fill="#1a1c2c">
    <rect x="9.5" y="7.5" width="3" height="0.3"/>
    <rect x="9.5" y="8.2" width="3" height="0.3"/>
    <rect x="9.5" y="8.9" width="3" height="0.3"/>
    <rect x="33.5" y="7.5" width="3" height="0.3"/>
    <rect x="33.5" y="8.2" width="3" height="0.3"/>
    <rect x="33.5" y="8.9" width="3" height="0.3"/>
  </g>

  <!-- 装填状态指示灯（黄） -->
  <circle cx="35.5" cy="10" r="0.7" fill="#1a1c2c"/>
  <circle cx="35.5" cy="10" r="0.4" fill="#ffc61a"/>

  <!-- 电缆/液压管（沿中线） -->
  <rect x="9" y="11" width="28" height="0.5" fill="#1a1c2c"/>
  <rect x="9" y="11" width="28" height="0.2" fill="#566c86" opacity=".6"/>
  <!-- 液压接头 -->
  <rect x="15" y="10.4" width="1" height="1.6" fill="#333c57"/>
  <rect x="27" y="10.4" width="1" height="1.6" fill="#333c57"/>
  <rect x="15" y="10.4" width="1" height="0.3" fill="#566c86"/>
  <rect x="27" y="10.4" width="1" height="0.3" fill="#566c86"/>

  <!-- 装填滚轮（管内底部） -->
  <g fill="#333c57">
    <rect x="17" y="13" width="1.5" height="1.2"/>
    <rect x="25" y="13" width="1.5" height="1.2"/>
    <rect x="33" y="13" width="1.5" height="1.2"/>
  </g>
  <g fill="#566c86">
    <rect x="17" y="13" width="1.5" height="0.3"/>
    <rect x="25" y="13" width="1.5" height="0.3"/>
    <rect x="33" y="13" width="1.5" height="0.3"/>
  </g>

  <!-- 中段右侧：状态面板（在管与炮口之间） -->
  <rect x="37" y="6" width="5" height="10" fill="#1a1c2c"/>
  <rect x="37.5" y="6.5" width="4" height="9" fill="#333c57"/>
  <!-- 状态灯（黄=就绪 / 暗=锁定） -->
  <rect x="38" y="7" width="0.8" height="0.8" fill="#ffc61a"/>
  <rect x="40.5" y="7" width="0.8" height="0.8" fill="#1a1c2c"/>
  <!-- 状态标签条 -->
  <rect x="38" y="9" width="3.3" height="0.3" fill="#566c86"/>
  <rect x="38" y="10" width="3.3" height="0.3" fill="#566c86"/>
  <rect x="38" y="13" width="3.3" height="0.3" fill="#566c86"/>
  <rect x="38" y="14" width="3.3" height="0.3" fill="#566c86"/>
  <!-- 面板四角螺丝 -->
  <circle cx="37.8" cy="6.8" r="0.3" fill="#1a1c2c"/>
  <circle cx="41.2" cy="6.8" r="0.3" fill="#1a1c2c"/>
  <circle cx="37.8" cy="15.2" r="0.3" fill="#1a1c2c"/>
  <circle cx="41.2" cy="15.2" r="0.3" fill="#1a1c2c"/>

  <!-- 发射架顶受光 + 底阴影 -->
  <path d="M2 3H48L48 4H2Z" fill="#94b0c2" opacity=".5"/>
  <path d="M2 19H48V20H2Z" fill="#1a1c2c" opacity=".7"/>

  <!-- 危险黄警示 -->
  <rect x="2" y="3" width="46" height="0.6" fill="#ffc61a"/>
  <rect x="2" y="18.4" width="46" height="0.6" fill="#ffc61a"/>

  <!-- 铆钉（4 角） -->
  <g fill="#1a1c2c">
    <circle cx="4" cy="4" r="0.5"/>
    <circle cx="46" cy="4" r="0.5"/>
    <circle cx="4" cy="18" r="0.5"/>
    <circle cx="46" cy="18" r="0.5"/>
  </g>

  <!-- 炮口（右端：方形） -->
  <rect x="42" y="3" width="6" height="16" fill="#1a1c2c" stroke="#0a0e1a" stroke-width="1"/>
  <rect x="43" y="5" width="4" height="12" fill="#0a0e1a"/>
  <!-- 炮口内膛（暗） -->
  <rect x="44" y="7" width="2" height="8" fill="#1a1c2c"/>
  <!-- 炮口顶/底黄色 -->
  <rect x="42" y="3" width="6" height="0.6" fill="#ffc61a"/>
  <rect x="42" y="18.4" width="6" height="0.6" fill="#ffc61a"/>
</svg>

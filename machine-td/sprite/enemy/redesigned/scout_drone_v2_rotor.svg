    <g fill="#94b0c2" stroke="#1a1c2c" stroke-width="0.4" opacity=".85">
      <rect x="-3" y="-0.6" width="3" height="1.2"/>
      <rect x="0" y="-0.6" width="3" height="1.2"/>
      <rect x="-0.6" y="-3" width="1.2" height="3"/>

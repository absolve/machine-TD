  <rect x="42" y="34" width="6" height="1" fill="#94b0c2"/>
  <rect x="42" y="36" width="6" height="1" fill="#94b0c2"/>
  <rect x="42" y="38" width="6" height="1" fill="#94b0c2"/>
  <rect x="40" y="32" width="10" height="2" fill="#1a1c2c" opacity=".5"/>

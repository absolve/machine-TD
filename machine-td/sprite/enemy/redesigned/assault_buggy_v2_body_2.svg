  <rect x="11" y="23" width="2" height="2" fill="#94b0c2" opacity=".5"/>
  <rect x="51" y="20" width="2" height="2" fill="#a95035"/>
  <rect x="51" y="23" width="2" height="2" fill="#a95035" opacity=".5"/>

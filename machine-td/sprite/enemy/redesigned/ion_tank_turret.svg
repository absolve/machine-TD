<svg xmlns="http://www.w3.org/2000/svg" width="50" height="22" viewBox="0 0 50 22" shape-rendering="crispEdges">
  <!-- 离子坦克炮塔：双管 + 紫色能量指示 -->
  <!-- 旋转底座（圆形） -->
  <circle cx="17" cy="11" r="8" fill="#0a0e1a"/>
  <circle cx="17" cy="11" r="7" fill="#45576b" stroke="#1a1c2c" stroke-width="1.2"/>
  <circle cx="17" cy="11" r="5.5" fill="#566c86"/>
  <!-- 底座刻线 -->
  <g stroke="#1a1c2c" stroke-width="0.8" opacity=".7">
    <path d="M9.5 11h1.5M23 11h1.5M17 4v1.5M17 16.5v1.5"/>
  </g>
  <!-- 底座中心紫光 -->
  <circle cx="17" cy="11" r="2.5" fill="#2a1f4a"/>
  <circle cx="17" cy="11" r="1.6" fill="#7c5fff" opacity=".95"/>
  <circle cx="17" cy="11" r="0.8" fill="#a8b8ff"/>
  <!-- 炮塔装甲盒 -->
  <rect x="5" y="7" width="10" height="8" rx="1.5" fill="#566c86" stroke="#1a1c2c" stroke-width="1.4"/>
  <!-- 装甲顶部高光 -->
  <path d="M5 7H15L13 9H7Z" fill="#dceaf2" opacity=".55"/>
  <!-- 装甲侧面阴影 -->
  <path d="M5 13H15L13 15H7Z" fill="#333c57" opacity=".8"/>
  <!-- 装甲刻线 -->
  <g stroke="#1a1c2c" stroke-width="0.8" opacity=".8">
    <path d="M10 7v8M5 11h10"/>
  </g>
  <!-- 紫色能量灯 -->
  <rect x="6" y="10.5" width="2" height="1.5" fill="#7c5fff"/>
  <rect x="12" y="10.5" width="2" height="1.5" fill="#7c5fff" opacity=".7"/>
  <!-- 双炮管基座 -->
  <rect x="20" y="6" width="4" height="9" fill="#45576b" stroke="#1a1c2c" stroke-width="1.2"/>
  <!-- 上炮管 -->
  <rect x="22" y="6" width="14" height="3" fill="#5f7794" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="22" y="9" width="14" height="1" fill="#1a1c2c"/>
  <rect x="22" y="10" width="14" height="2" fill="#5f7794"/>
  <!-- 上炮管紫色能量槽 -->
  <rect x="24" y="11" width="10" height="1" fill="#7c5fff" opacity=".95"/>
  <rect x="24" y="11" width="10" height="0.4" fill="#a8b8ff"/>
  <!-- 上炮口 -->
  <rect x="36" y="5" width="6" height="6" rx="0.8" fill="#333c57" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="37" y="7" width="4" height="2" rx="0.3" fill="#0a0e1a"/>
  <circle cx="39" cy="8" r="1" fill="#7c5fff" opacity=".9"/>
  <!-- 下炮管 -->
  <rect x="22" y="13" width="14" height="3" fill="#5f7794" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="22" y="16" width="14" height="1" fill="#1a1c2c"/>
  <rect x="22" y="17" width="14" height="2" fill="#5f7794"/>
  <rect x="24" y="18" width="10" height="1" fill="#7c5fff" opacity=".95"/>
  <rect x="24" y="18" width="10" height="0.4" fill="#a8b8ff"/>
  <!-- 下炮口 -->
  <rect x="36" y="12" width="6" height="6" rx="0.8" fill="#333c57" stroke="#1a1c2c" stroke-width="1.2"/>
  <rect x="37" y="14" width="4" height="2" rx="0.3" fill="#0a0e1a"/>
  <circle cx="39" cy="15" r="1" fill="#7c5fff" opacity=".9"/>
  <!-- 顶部天线/传感器 -->
  <rect x="13" y="3" width="1" height="4" fill="#1a1c2c"/>
  <circle cx="13.5" cy="3" r="1" fill="#7c5fff"/>
  <circle cx="13.5" cy="3" r="0.5" fill="#a8b8ff"/>
</svg>